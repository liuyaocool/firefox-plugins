<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>排除</title>
    <style>
        body {
            background-color: #181a1b;
        }
        body, #config, .input {
            color: white;
        }
        h2 {
            margin: 0;
        }
        .input {
            outline: none;
            background: none;
            margin-bottom: 5px;
            border: white solid 1px;
            width: 300px;
        }
        .input:focus {
            border-color: #97ff00;   
        }
        #exclude_domain {
            resize: none;
            height: 300px;
        }
        tip {
            color: gray;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <form id="main_form">
        <h2>排除站点</h2>
        <textarea name="exclude_domain" class="input" id="exclude_domain"></textarea><br>
        <input type="button" value="添加本域名" id="add_this">
        <input type="button" value="删除本域名" id="rm_this">

        <h2>划词翻译长度<tip>超出长度右键点击翻译</tip></h2>
        <input name="auto_trans_len" type="number" class='input' placeholder="默认300" id="str_len">

        <h2>Ollama接口</h2>
        <div id="ollama_list"></div>
        <input name="ollama_api"   type="text" class="input" placeholder="地址 如: http://127.0.0.1:11434/api/generate"><br>
        <input name="ollama_model" type="text" class="input" placeholder="模型 如: deepseek-v2:16b">
        <hr>
        <input type="button" value="保存" id="save">
    </form>    
    <script src="js/constant.js"></script>
    <script src="js/options.js"></script>
</body>
</html>
